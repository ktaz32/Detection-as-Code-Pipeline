title: Encoded PowerShell Command Execution
id: 5f8f3d70-4dc0-4f21-9f06-0ce23c2b1001
status: experimental
description: >
  Detects PowerShell execution using encoded command-line arguments.
  Encoded PowerShell is commonly used to obscure command content and may
  indicate malicious script execution or defense evasion.
author: Khaled Taseen
date: 2026-08-23

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_encoded:
    CommandLine|contains:
      - ' -enc '
      - ' -enc:'
      - ' -encodedcommand '
      - ' -encodedcommand:'
      - ' /enc '
      - ' /encodedcommand '

  condition: selection_image and selection_encoded

falsepositives:
  - Legitimate administrative automation using encoded PowerShell
  - Software deployment or management tools using encoded commands

level: medium

tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion