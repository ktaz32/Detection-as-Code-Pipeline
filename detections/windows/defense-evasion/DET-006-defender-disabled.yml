title: Windows Defender Disabled or Weakened
id: 9d2a51fd-3ff2-4c45-8fd4-75ec4f5a6006
status: experimental
description: >
  Detects PowerShell commands that disable or weaken Microsoft Defender
  protections, including disabling real-time monitoring or adding
  antivirus exclusions. Such activity may indicate defense evasion,
  malware execution preparation, or unauthorized security-control changes.
author: Khaled Taseen
date: 2026-08-24

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_defender_change:
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'Add-MpPreference'
      - '-DisableRealtimeMonitoring'
      - '-DisableBehaviorMonitoring'
      - '-DisableIOAVProtection'
      - '-ExclusionPath'
      - '-ExclusionProcess'
      - '-ExclusionExtension'

  condition: selection_image and selection_defender_change

falsepositives:
  - Authorized endpoint-security administration
  - Approved troubleshooting
  - Security testing in a controlled environment
  - Enterprise configuration-management activity

level: high

tags:
  - attack.defense-evasion
  - attack.t1562.001